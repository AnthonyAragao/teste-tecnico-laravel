[PHP]
; File upload limits
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Session settings
session.gc_maxlifetime = 1440
session.cookie_lifetime = 0

; Error reporting
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = America/Sao_Paulo